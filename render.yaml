services:
  - type: web
    name: backend-concepts-tutor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python -m waitress --host=0.0.0.0 --port=$PORT app:app
    envVars:
      - key: RAG_BACKEND
        value: demo
      - key: PYTHON_VERSION
        value: 3.12.10
