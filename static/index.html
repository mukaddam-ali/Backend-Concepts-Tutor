<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Backend Concepts Tutor</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<meta name="theme-color" content="#bf4d00" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          background: 'var(--background)',
          foreground: 'var(--foreground)',
          card: 'var(--card)',
          'card-foreground': 'var(--card-foreground)',
          primary: 'var(--primary)',
          'primary-foreground': 'var(--primary-foreground)',
          secondary: 'var(--secondary)',
          'secondary-foreground': 'var(--secondary-foreground)',
          muted: 'var(--muted)',
          'muted-foreground': 'var(--muted-foreground)',
          accent: 'var(--accent)',
          'accent-foreground': 'var(--accent-foreground)',
          destructive: 'var(--destructive)',
          border: 'var(--border)',
          input: 'var(--input)',
          ring: 'var(--ring)',
          sidebar: 'var(--sidebar)',
          'sidebar-foreground': 'var(--sidebar-foreground)',
          'sidebar-accent': 'var(--sidebar-accent)',
          'sidebar-border': 'var(--sidebar-border)',
        },
        borderRadius: {
          sm: 'calc(var(--radius) - 4px)',
          md: 'calc(var(--radius) - 2px)',
          lg: 'var(--radius)',
          xl: 'calc(var(--radius) + 4px)',
        },
      },
    },
  };
</script>
<link rel="stylesheet" href="style.css" />
</head>
<body class="h-screen flex overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-64 shrink-0 bg-sidebar text-sidebar-foreground border-r border-sidebar-border flex flex-col transition-transform duration-200 -translate-x-full md:translate-x-0 fixed md:static inset-y-0 left-0 z-20">
    <div class="p-3">
      <button id="new-chat-btn" class="w-full flex items-center gap-2 rounded-lg border border-sidebar-border px-3 py-2.5 text-sm font-medium hover:bg-sidebar-accent transition-colors cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New chat
      </button>
    </div>

    <div class="px-3 pb-1 pt-2 text-xs font-medium text-muted-foreground">Chats</div>
    <nav id="conversation-list" class="flex-1 overflow-y-auto px-2 space-y-0.5 pb-2"></nav>

    <div class="p-3 border-t border-sidebar-border">
      <div id="status-pill" class="flex items-center gap-2 text-xs text-muted-foreground">
        <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-primary"></span>
        <span id="status-text">Checking backend&hellip;</span>
      </div>
    </div>
  </aside>

  <div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 z-10 md:hidden"></div>

  <!-- Main -->
  <div class="flex-1 flex flex-col min-w-0 bg-background">
    <header class="h-14 flex items-center gap-3 px-4 border-b border-border shrink-0">
      <button id="sidebar-toggle" class="md:hidden cursor-pointer text-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
      <span class="font-semibold text-sm">Backend Concepts Tutor</span>
    </header>

    <main id="chat" class="flex-1 overflow-y-auto">
      <div id="empty-state" class="h-full flex flex-col items-center justify-center px-4">
        <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mb-4">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-5 h-5 text-primary" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Z"/>
            <path d="M8 12h8M12 8v8"/>
          </svg>
        </div>
        <h1 class="text-2xl font-semibold mb-1 text-center">What do you want to know?</h1>
        <p class="text-sm text-muted-foreground mb-8 text-center max-w-md">
          Ask about backend engineering &mdash; I only answer from my knowledge base.
        </p>
        <div id="suggestions" class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-w-xl w-full"></div>
      </div>

      <div id="messages" class="max-w-3xl mx-auto py-8 px-4 flex flex-col gap-6 hidden"></div>
    </main>

    <footer class="border-t border-border shrink-0">
      <form id="chat-form" class="max-w-3xl mx-auto px-4 pt-4 flex items-end gap-3">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Ask a backend engineering question&hellip;"
          class="flex-1 resize-none bg-secondary border border-border rounded-xl px-4 py-3 text-sm placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring/50 focus:border-ring"
        ></textarea>
        <button
          type="submit"
          id="send-btn"
          class="bg-primary text-primary-foreground rounded-xl px-4 py-3 text-sm font-medium cursor-pointer hover:opacity-90 transition-opacity disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Send
        </button>
      </form>
      <p class="text-center text-xs text-muted-foreground py-3">
        Answers are generated only from the local knowledge base and may be incomplete.
      </p>
    </footer>
  </div>

  <!-- Source viewer modal -->
  <div id="source-modal-overlay" class="source-modal-overlay hidden">
    <div class="source-modal">
      <div class="source-modal-header">
        <h2 id="source-modal-title">Source</h2>
        <button id="source-modal-close" class="source-modal-close" aria-label="Close">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div id="source-modal-body" class="source-modal-body"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
